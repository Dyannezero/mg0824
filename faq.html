<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="사내 업무 FAQ를 키워드와 분류로 검색하는 교육용 웹앱" />
  <title>업무 FAQ 검색</title>
  <style>
    :root {
      --page-bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f7f9fc;
      --text: #172033;
      --muted: #64748b;
      --line: #dfe6ef;
      --primary: #2457d6;
      --primary-dark: #1744b5;
      --primary-soft: #eaf0ff;
      --highlight: #fff0a8;
      --shadow: 0 18px 45px rgba(31, 50, 81, 0.10);
      --radius-lg: 22px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(36, 87, 214, 0.10), transparent 28rem),
        var(--page-bg);
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      width: min(100% - 32px, 980px);
      margin: 0 auto;
      padding: 64px 0 72px;
    }

    .hero {
      margin-bottom: 26px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      content: "";
      box-shadow: 0 0 0 5px var(--primary-soft);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.35rem);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    .hero-description {
      max-width: 680px;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 1.02rem;
    }

    .search-panel {
      padding: 24px;
      border: 1px solid rgba(223, 230, 239, 0.9);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .search-label,
    .filter-title {
      display: block;
      margin-bottom: 9px;
      color: #344055;
      font-size: 0.92rem;
      font-weight: 800;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
    }

    .search-input-wrap {
      position: relative;
    }

    .search-icon {
      position: absolute;
      top: 50%;
      left: 17px;
      width: 21px;
      height: 21px;
      color: #78869b;
      pointer-events: none;
      transform: translateY(-50%);
    }

    #searchInput {
      width: 100%;
      min-height: 52px;
      padding: 0 18px 0 50px;
      border: 1px solid #cfd8e5;
      border-radius: 13px;
      outline: none;
      color: var(--text);
      background: #fff;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    #searchInput::placeholder {
      color: #8a97a9;
    }

    #searchInput:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(36, 87, 214, 0.13);
    }

    .primary-button,
    .secondary-button {
      min-height: 52px;
      padding: 0 20px;
      border-radius: 13px;
      font-weight: 800;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .primary-button {
      border: 1px solid var(--primary);
      color: #fff;
      background: var(--primary);
    }

    .primary-button:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      transform: translateY(-1px);
    }

    .secondary-button {
      border: 1px solid #cfd8e5;
      color: #334155;
      background: #fff;
    }

    .secondary-button:hover {
      border-color: #aebacc;
      background: var(--surface-soft);
      transform: translateY(-1px);
    }

    .filter-section {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .filter-chip {
      min-height: 39px;
      padding: 0 16px;
      border: 1px solid #d5deea;
      border-radius: 999px;
      color: #475569;
      background: #fff;
      font-size: 0.92rem;
      font-weight: 750;
      transition: all 0.18s ease;
    }

    .filter-chip:hover {
      border-color: #aebbd0;
      color: var(--primary);
    }

    .filter-chip.is-active {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-soft);
      box-shadow: inset 0 0 0 1px rgba(36, 87, 214, 0.08);
    }

    .results-section {
      margin-top: 32px;
    }

    .results-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .results-heading {
      margin: 0;
      font-size: 1.28rem;
      letter-spacing: -0.02em;
    }

    .result-count {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .result-count strong {
      color: var(--primary);
      font-size: 1.05rem;
    }

    .results-list {
      display: grid;
      gap: 14px;
    }

    .faq-card {
      padding: 23px 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: 0 8px 22px rgba(31, 50, 81, 0.055);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .faq-card:hover {
      border-color: #c6d3e6;
      box-shadow: 0 13px 28px rgba(31, 50, 81, 0.085);
      transform: translateY(-2px);
    }

    .card-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      min-height: 29px;
      padding: 0 11px;
      border-radius: 999px;
      color: var(--primary);
      background: var(--primary-soft);
      font-size: 0.79rem;
      font-weight: 850;
    }

    .question-label,
    .answer-label {
      color: #7a879a;
      font-size: 0.76rem;
      font-weight: 850;
      letter-spacing: 0.08em;
    }

    .faq-question {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.55;
      letter-spacing: -0.015em;
    }

    .answer-block {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #edf1f6;
    }

    .answer-label {
      padding-top: 2px;
      color: var(--primary);
    }

    .faq-answer {
      margin: 0;
      color: #445065;
    }

    mark {
      padding: 0.06em 0.14em;
      border-radius: 4px;
      color: inherit;
      background: var(--highlight);
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .empty-state {
      padding: 46px 24px;
      border: 1px dashed #cbd6e4;
      border-radius: var(--radius-md);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.72);
      text-align: center;
    }

    .empty-icon {
      display: grid;
      width: 48px;
      height: 48px;
      margin: 0 auto 13px;
      place-items: center;
      border-radius: 50%;
      color: var(--primary);
      background: var(--primary-soft);
      font-size: 1.35rem;
      font-weight: 900;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 4px;
      color: #334155;
      font-size: 1.03rem;
    }

    .empty-state p {
      margin: 0;
    }

    .data-note {
      margin: 18px 2px 0;
      color: #7d899a;
      font-size: 0.84rem;
      text-align: right;
    }

    :focus-visible {
      outline: 3px solid rgba(36, 87, 214, 0.28);
      outline-offset: 2px;
    }

    @media (max-width: 680px) {
      .app-shell {
        width: min(100% - 22px, 980px);
        padding: 38px 0 48px;
      }

      .search-panel {
        padding: 18px;
        border-radius: 18px;
      }

      .search-row {
        grid-template-columns: 1fr 1fr;
      }

      .search-input-wrap {
        grid-column: 1 / -1;
      }

      .primary-button,
      .secondary-button {
        padding: 0 12px;
      }

      .results-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 3px;
      }

      .faq-card {
        padding: 20px 18px;
      }

      .answer-block {
        grid-template-columns: 1fr;
        gap: 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">INTERNAL FAQ</p>
      <h1>업무 FAQ 검색</h1>
      <p class="hero-description">
        질문이나 키워드를 입력하고 분류를 선택하면 등록된 FAQ 안에서만 결과를 찾아 표시합니다.
      </p>
    </header>

    <section class="search-panel" aria-labelledby="searchPanelTitle">
      <h2 id="searchPanelTitle" class="search-label">FAQ 검색</h2>
      <div class="search-row">
        <div class="search-input-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input
            id="searchInput"
            type="search"
            placeholder="질문이나 키워드를 입력하세요."
            autocomplete="off"
            aria-label="질문이나 키워드 검색"
          />
        </div>
        <button id="searchButton" class="primary-button" type="button">검색</button>
        <button id="showAllButton" class="secondary-button" type="button">전체보기</button>
      </div>

      <div class="filter-section" aria-labelledby="filterTitle">
        <span id="filterTitle" class="filter-title">분류</span>
        <div id="categoryFilters" class="filter-row" role="group" aria-label="FAQ 분류 선택">
          <button class="filter-chip is-active" type="button" data-category="전체" aria-pressed="true">전체</button>
          <button class="filter-chip" type="button" data-category="교육" aria-pressed="false">교육</button>
          <button class="filter-chip" type="button" data-category="문서" aria-pressed="false">문서</button>
          <button class="filter-chip" type="button" data-category="IT" aria-pressed="false">IT</button>
          <button class="filter-chip" type="button" data-category="보안" aria-pressed="false">보안</button>
        </div>
      </div>
    </section>

    <section class="results-section" aria-labelledby="resultsHeading">
      <div class="results-header">
        <h2 id="resultsHeading" class="results-heading">검색 결과</h2>
        <p id="resultCount" class="result-count" aria-live="polite"></p>
      </div>
      <div id="resultsList" class="results-list"></div>
      <p class="data-note">등록된 FAQ 데이터 안에서만 검색합니다.</p>
    </section>
  </main>

  <script>
    "use strict";

    // 첨부 JSON 원문을 그대로 내장합니다.
    const faqData = [
  {
    "category": "교육",
    "question": "교육 신청은 어디에서 하나요?",
    "answer": "사내 교육 포털 접속 후, [과정 검색] 메뉴에서 원하시는 교육을 검색하여 신청 메뉴를 통해 접수하시면 됩니다."
  },
  {
    "category": "교육",
    "question": "신청한 교육을 취소하려면 어떻게 하나요?",
    "answer": "마이페이지의 신청내역 메뉴에서 해당 과정의 취소 가능 여부(기간 등)를 먼저 확인하신 후 취소 처리를 진행하실 수 있습니다."
  },
  {
    "category": "문서",
    "question": "주간 업무보고에는 무엇을 넣어야 하나요?",
    "answer": "금주의 주요 업무 실적, 진행 중 발생한 이슈 및 해결 방안, 그리고 다음 주 주요 업무 계획을 중심으로 작성해 주시면 됩니다."
  },
  {
    "category": "문서",
    "question": "외부 발송용 공문은 어떤 양식을 사용해야 하나요?",
    "answer": "사내 인트라넷의 [문서 양식함]에서 제공하는 최신 외부 발송용 공문 템플릿을 다운로드하여 사용하시기 바랍니다."
  },
  {
    "category": "IT",
    "question": "사내 시스템 접속이 되지 않습니다.",
    "answer": "우선 사내 네트워크(VPN 등) 연결 상태를 점검하시고, 권장 브라우저를 사용 중인지 점검한 뒤, 계정 상태(비밀번호 오류 초과 등)를 순서대로 확인해 주시기 바랍니다."
  },
  {
    "category": "IT",
    "question": "사내 계정 비밀번호를 분실했습니다. 초기화 방법이 궁금합니다.",
    "answer": "포털 로그인 화면 하단의 [비밀번호 찾기/초기화] 버튼을 클릭하여, 사원번호와 등록된 휴대폰 번호로 본인 인증을 진행한 후 새로운 비밀번호로 재설정할 수 있습니다."
  },
  {
    "category": "보안",
    "question": "ChatGPT에 내부 업무자료를 넣어도 되나요?",
    "answer": "교육이나 실습 시에는 가상의 합성자료를 사용해야 하며, 실제 내부 업무 자료를 활용하고자 할 때는 조직의 보안 규정 및 AI 사용 기준을 반드시 먼저 확인하셔야 합니다."
  },
  {
    "category": "보안",
    "question": "외부 협력업체에 자료를 전달할 때 주의할 점은 무엇인가요?",
    "answer": "사내 문서를 외부로 반출할 경우 반드시 문서 DRM(암호화)을 적용하고, 사전에 부서장의 승인을 득한 후 공식 사내 메일을 통해서만 발송해야 합니다."
  }
];

    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const showAllButton = document.getElementById("showAllButton");
    const categoryFilters = document.getElementById("categoryFilters");
    const resultsList = document.getElementById("resultsList");
    const resultCount = document.getElementById("resultCount");

    let activeCategory = "전체";

    function normalizeText(value) {
      return String(value ?? "").toLocaleLowerCase("ko-KR");
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function getSearchTerms() {
      return [...new Set(
        searchInput.value
          .trim()
          .split(/\s+/)
          .map((term) => term.trim())
          .filter(Boolean)
      )].sort((a, b) => b.length - a.length);
    }

    function highlightText(value, terms) {
      const safeValue = escapeHTML(value);
      if (terms.length === 0) return safeValue;

      const pattern = terms.map(escapeRegExp).join("|");
      if (!pattern) return safeValue;

      return safeValue.replace(new RegExp(`(${pattern})`, "gi"), "<mark>$1</mark>");
    }

    function matchesSearch(item, terms) {
      if (terms.length === 0) return true;

      const searchableText = normalizeText(
        `${item.category} ${item.question} ${item.answer_seed}`
      );

      return terms.every((term) => searchableText.includes(normalizeText(term)));
    }

    function getFilteredFaqs() {
      const terms = getSearchTerms();

      return faqData.filter((item) => {
        const categoryMatches = activeCategory === "전체" || item.category === activeCategory;
        return categoryMatches && matchesSearch(item, terms);
      });
    }

    function createFaqCard(item, terms) {
      return `
        <article class="faq-card">
          <div class="card-topline">
            <span class="category-badge">${highlightText(item.category, terms)}</span>
            <span class="question-label">질문</span>
          </div>
          <h3 class="faq-question">${highlightText(item.question, terms)}</h3>
          <div class="answer-block">
            <span class="answer-label">답변</span>
            <p class="faq-answer">${highlightText(item.answer_seed, terms)}</p>
          </div>
        </article>
      `;
    }

    function renderResults() {
      const filteredFaqs = getFilteredFaqs();
      const terms = getSearchTerms();

      resultCount.innerHTML = `총 <strong>${filteredFaqs.length}</strong>건`;

      if (filteredFaqs.length === 0) {
        resultsList.innerHTML = `
          <div class="empty-state" role="status">
            <div class="empty-icon" aria-hidden="true">0</div>
            <strong>일치하는 FAQ가 없습니다.</strong>
            <p>검색어 또는 분류를 바꾸거나 전체보기를 선택해 주세요.</p>
          </div>
        `;
        return;
      }

      resultsList.innerHTML = filteredFaqs
        .map((item) => createFaqCard(item, terms))
        .join("");
    }

    function setActiveCategory(category) {
      activeCategory = category;

      categoryFilters.querySelectorAll(".filter-chip").forEach((button) => {
        const isActive = button.dataset.category === category;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });

      renderResults();
    }

    searchInput.addEventListener("input", renderResults);

    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") renderResults();
    });

    searchButton.addEventListener("click", renderResults);

    categoryFilters.addEventListener("click", (event) => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      setActiveCategory(button.dataset.category);
    });

    showAllButton.addEventListener("click", () => {
      searchInput.value = "";
      setActiveCategory("전체");
      searchInput.focus();
    });

    renderResults();
  </script>
</body>
</html>
